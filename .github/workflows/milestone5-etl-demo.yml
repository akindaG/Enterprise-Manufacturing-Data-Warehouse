name: Manufacturing Data Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-platform:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manufacturing_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manufacturing_dw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/manufacturing_dw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile etl_pipeline/*.py dashboard/*.py

      - name: Run unit tests
        run: python -m pytest

      - name: Create controlled warehouse schema
        run: |
          psql -h localhost -U postgres -d manufacturing_dw -f warehouse_database/staging_tables.sql
          psql -h localhost -U postgres -d manufacturing_dw -f warehouse_database/dimension_tables.sql
          psql -h localhost -U postgres -d manufacturing_dw -f warehouse_database/fact_tables.sql
          psql -h localhost -U postgres -d manufacturing_dw -f warehouse_database/warehouse_schema.sql
          psql -h localhost -U postgres -d manufacturing_dw -f warehouse_database/indexes.sql
          psql -h localhost -U postgres -d manufacturing_dw -f warehouse_database/analytics_views.sql

      - name: First ETL execution
        run: python -m etl_pipeline.run_etl --source-dir source_data/run_1 --run-date 2026-08-01

      - name: Second ETL execution
        run: python -m etl_pipeline.run_etl --source-dir source_data/run_2 --run-date 2026-08-15

      - name: Verify SCD Type 2 and incremental loading
        run: |
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM etl_run_log WHERE status='SUCCESS';")" -eq 2
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM dim_machine WHERE machine_id='M001';")" -eq 2
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM dim_machine WHERE machine_id='M001' AND factory_id='F001' AND is_current=FALSE;")" -eq 1
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM dim_machine WHERE machine_id='M001' AND factory_id='F002' AND is_current=TRUE;")" -eq 1
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM dim_machine WHERE machine_id='M002';")" -eq 1
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM dim_machine WHERE machine_id='M003' AND is_current=TRUE;")" -eq 1
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM fact_production;")" -eq 4
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(DISTINCT production_id) FROM fact_production;")" -eq 4

      - name: Verify historical surrogate-key resolution
        run: |
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM fact_production f JOIN dim_machine m ON m.machine_key=f.machine_key WHERE f.production_id='PR001' AND m.machine_id='M001' AND m.factory_id='F001';")" -eq 1
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM fact_production f JOIN dim_machine m ON m.machine_key=f.machine_key WHERE f.production_id='PR003' AND m.machine_id='M001' AND m.factory_id='F002';")" -eq 1

      - name: Run warehouse quality gates
        run: |
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM fact_production WHERE defect_count > quantity_produced OR defect_count < 0 OR quantity_produced < 0;")" -eq 0
          test "$(psql -h localhost -U postgres -d manufacturing_dw -tAc "SELECT COUNT(*) FROM fact_production f JOIN dim_date d ON d.date_key=f.date_key JOIN dim_machine m ON m.machine_key=f.machine_key WHERE d.full_date NOT BETWEEN m.effective_date AND m.expiry_date;")" -eq 0
          psql -h localhost -U postgres -d manufacturing_dw -f analytics/data_quality_checks.sql
          psql -h localhost -U postgres -d manufacturing_dw -f analytics/scd_verification.sql
          psql -h localhost -U postgres -d manufacturing_dw -f analytics/production_kpi_analysis.sql

      - name: Build reproducible evidence artifact
        run: |
          mkdir -p ci_evidence
          psql -h localhost -U postgres -d manufacturing_dw --csv -c "SELECT run_id, run_date, source_dir, status, facts_inserted, machine_versions_created FROM etl_run_log ORDER BY run_id;" > ci_evidence/etl_run_log.csv
          psql -h localhost -U postgres -d manufacturing_dw --csv -c "SELECT machine_key, machine_id, machine_name, machine_type, factory_id, machine_status, effective_date, expiry_date, is_current FROM dim_machine ORDER BY machine_id, effective_date;" > ci_evidence/dim_machine_history.csv
          psql -h localhost -U postgres -d manufacturing_dw --csv -c "SELECT * FROM vw_production_dashboard ORDER BY production_date, production_id;" > ci_evidence/dashboard_view.csv
          psql -h localhost -U postgres -d manufacturing_dw -f analytics/production_kpi_analysis.sql > ci_evidence/analytical_results.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-data-platform-evidence
          path: ci_evidence/
          retention-days: 30
